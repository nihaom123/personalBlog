name: Daily Publish

on:
  schedule:
    # cron 为 UTC，北京时间 = UTC + 8
    - cron: "30 23 * * *" # 北京时间 07:30 morning
    - cron: "30 4 * * *" # 北京时间 12:30 noon
    - cron: "30 12 * * *" # 北京时间 20:30 evening
  workflow_dispatch:
    inputs:
      batch:
        description: "发布批次；auto 按当前北京时间就近匹配"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - morning
          - noon
          - evening

concurrency:
  group: daily-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish due drafts
        id: publish
        env:
          BATCH: ${{ inputs.batch || 'auto' }}
        run: node scripts/publish-due-posts.mjs --batch "$BATCH"

      - name: Commit and push
        if: steps.publish.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/posts
          git commit -m "chore(content): publish ${{ steps.publish.outputs.batch }} batch"
          git push
